<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digi Search Engine</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<link rel="stylesheet" href="./styles.css"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark" aria-label="Digi logo">D</div><div class="brand-home"><span id="digi-update-status" class="update-status-dot home-status-slot" data-status="checking" role="status" aria-label="Checking for Digi updates" title="Checking for Digi updates…"></span> Home</div></div>
<div class="ui-input-container search-wrap">
  <input id="search" required class="ui-input search-input" placeholder="Search files..." autocomplete="off" type="text">
  <div class="ui-input-underline"></div>
  <div class="ui-input-highlight"></div>
  <div class="ui-input-icon" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="currentColor" d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"></path>
    </svg>
  </div>
  <button id="clear" class="icon-button" aria-label="Clear search" title="Clear search">×</button>
</div>
<div class="header-actions"><button class="ui-button" id="incoming">Incoming</button><button class="ui-button" id="repository">Repository</button><span class="window-controls"><button class="window-control" id="window-minimize" aria-label="Minimise" title="Minimise">−</button><button class="window-control" id="window-maximize" aria-label="Maximise or restore" title="Maximise or restore">□</button><button class="window-control window-close" id="window-close" aria-label="Close" title="Close">×</button></span></div>
</header>
<main class="layout"><aside class="sidebar"><div class="section-label">FILTERS</div>
<label>Type<select id="type"><option>All types</option><option>PDF</option><option>Word</option></select></label>
<label>Status<select id="status"><option>All statuses</option><option>Not started</option><option>In progress</option><option>Finished</option><option>Due</option><option>Due late</option></select></label>
<label>Source<select id="source"><option>All sources</option><option>ExamPro</option><option>PMT</option></select></label>
<label>Search<select id="method"><option>Normal</option><option>Fuzzy</option></select></label>
<label>Sort<select id="sort"><option>Relevance</option><option>Name A-Z</option><option>Name Z-A</option><option>Newest modified</option><option>Oldest modified</option><option>Most pages</option><option>Fewest pages</option></select></label>
<button class="wide-button" id="scan">Update index</button><button class="wide-button" id="recent">Recent searches</button></aside>
<section class="content"><div class="content-head"><div><h1 class="digi-home-logo" aria-label="Digi">Digi<span class="digi-home-logo-dot" aria-hidden="true"></span></h1><p id="hint" hidden></p></div><span id="count">0 results</span></div><div id="results" class="results"></div></section></main>
<nav class="home-cards" aria-label="Digi tools">
  <button class="home-card" id="home-notes" type="button"><span class="home-card-icon" aria-hidden="true">✎</span><span class="home-card-title">Notes</span><span class="home-card-copy">Your notebooks and pages</span><span class="home-card-arrow" aria-hidden="true">↗</span></button>
  <button class="home-card" id="home-cloud" type="button"><span class="home-card-icon" aria-hidden="true">☁</span><span class="home-card-title">Cloud</span><span class="home-card-copy">Your files, anywhere</span><span class="home-card-arrow" aria-hidden="true">↗</span></button>
  <button class="home-card" id="home-wiki" type="button"><span class="home-card-icon" aria-hidden="true">▤</span><span class="home-card-title">Wiki</span><span class="home-card-copy">Knowledge in one place</span><span class="home-card-arrow" aria-hidden="true">↗</span></button>
</nav>
<div id="modal" class="modal hidden"></div>
<div id="digi-update-dialog" class="digi-update-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="digi-update-title">
  <div class="digi-update-card">
    <div id="digi-update-title" class="digi-update-title">Digi update available</div>
    <p class="digi-update-copy">Version <strong id="digi-update-version"></strong> is available. The checker will not install or change anything automatically. You can review the release details, or be reminded again next time you launch Digi.</p>
    <div class="digi-update-actions"><button class="ui-button" id="digi-update-later">Later</button><button class="ui-button digi-update-primary" id="digi-update-details">Release details</button></div>
  </div>
</div>
<script src="./app.js"></script><script src="../updater/update_checker.js"></script></body></html>
